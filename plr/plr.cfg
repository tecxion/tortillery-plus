# Recuperacion tras corte de luz (PLR) - Artillery X4 Pro/Plus
# Requiere ~/klipper/klippy/extras/plr.py
# Uso: tras el corte, pulsar "Confirmar" en la pantalla o lanzar RESUME_INTERRUPTED.
#      PLR_CLEAR descarta la impresion guardada.

[plr]
interval: 5          # segundos entre guardados durante la impresion
#filename: ~/printer_data/plr_state.json

[gcode_macro RESUME_INTERRUPTED]
description: Continua la impresion interrumpida por un corte de luz
gcode:
    {% set s = printer.plr %}
    {% set cfg = printer.configfile.settings %}
    {% if not s.pending %}
        {action_raise_error("PLR: no hay ninguna impresion interrumpida")}
    {% elif printer.print_stats.state in ('printing', 'paused') %}
        {action_raise_error("PLR: ya se ha reanudado (pantalla o Telegram)")}
    {% elif not s.file_exists %}
        {action_raise_error("PLR: no se encuentra '%s'. Inserta el USB con el archivo." % s.file)}
    {% elif s.extruder_temp < cfg.extruder.min_extrude_temp %}
        {action_raise_error("PLR: el corte fue sin temperatura de boquilla; no se puede reanudar")}
    {% elif s.x < cfg.stepper_x.position_min or s.x > cfg.stepper_x.position_max
         or s.y < cfg.stepper_y.position_min or s.y > cfg.stepper_y.position_max %}
        {action_raise_error("PLR: posicion X/Y guardada fuera de los limites")}
    {% elif s.toolhead_z + 5 > cfg.stepper_z.position_max %}
        {action_raise_error("PLR: no hay margen para subir Z 5 mm sobre la pieza")}
    {% endif %}
    {action_respond_info("PLR: reanudando %s en Z=%.2f (byte %d)" % (s.file, s.z, s.position))}
    M140 S{s.bed_temp}
    M104 S{s.extruder_temp}
    # El eje Z no se puede volver a homear (la sonda chocaria con la pieza):
    # se asume que Z no se movio con la maquina apagada (husillos).
    # homing_override sube Z 5 mm antes de homear X/Y y deja Z=5.
    G28 X Y
    SET_KINEMATIC_POSITION Z={s.toolhead_z + 5}
    M190 S{s.bed_temp}
    M109 S{s.extruder_temp}
    # Purga del material que goteo durante el calentamiento y retrae
    M83
    G1 E5 F150
    G1 E-2 F2400
    SET_GCODE_OFFSET Z={s.offset_z}
    M220 S{s.speed_factor * 100}
    M221 S{s.extrude_factor * 100}
    G90
    G1 X{s.x} Y{s.y} F6000
    G1 Z{s.z} F600
    G1 E2 F2400
    {% if s.absolute_extrude %}M82{% else %}M83{% endif %}
    G92 E{s.e}
    {% if not s.absolute_coordinates %}G91{% endif %}
    G1 F{s.speed}
    M106 S{(s.fan * 255) | int}
    {% if s.max_accel is defined %}
    SET_VELOCITY_LIMIT VELOCITY={s.max_velocity} ACCEL={s.max_accel} SQUARE_CORNER_VELOCITY={s.square_corner_velocity} MINIMUM_CRUISE_RATIO={s.minimum_cruise_ratio}
    {% endif %}
    {% if 'filament_switch_sensor fila' in printer %}
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE={1 if s.runout_enabled|default(true) else 0}
    {% endif %}
    PLR_START_FILE

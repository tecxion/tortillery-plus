# Tortillery+: KlipperLCD avisa a systemd cada 20 s mientras su refresco funciona (tortillery.watchdog_loop);
# si se cuelga o el hilo muere, systemd la reinicia (Restart=always ya está en el servicio).
# NotifyAccess=all: el servicio arranca python a través de sh -c.
[Service]
WatchdogSec=90
NotifyAccess=all

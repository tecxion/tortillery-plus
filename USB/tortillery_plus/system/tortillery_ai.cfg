# Tortillery+: vigilancia de la impresión con la cámara y una IA de visión (tortillery-ai.service).
# Rellena [ia] y guarda: se aplica sola en menos de un minuto, sin reiniciar nada.
# Necesita una webcam USB funcionando en Mainsail. Sin proveedor o sin api_key no hace nada.
# Prueba (por SSH, con la cámara mirando a la cama):  python3 /usr/local/bin/tortillery-ai.py --test
#
# proveedor:  anthropic | openai | google | nvidia | ollama | openai_compatible
#   anthropic         api_key de console.anthropic.com. modelo por defecto claude-opus-5-5; claude-haiku-5-5
#                     cuesta unas 40 veces menos por foto.
#   openai            api_key de platform.openai.com y modelo con visión (obligatorio).
#   google            api_key de aistudio.google.com. modelo por defecto gemini-2.5-flash.
#   nvidia            api_key de build.nvidia.com y modelo con visión (obligatorio), con el id exacto de
#                     build.nvidia.com (p. ej. nvidia/...). Si --test da 404, lista los modelos válidos.
#   ollama            sin api_key: url de tu PC con Ollama (p. ej. http://192.168.1.50:11434) y un modelo
#                     con visión descargado (por defecto qwen2.5vl). Gratis, pero el PC tiene que estar encendido.
#   openai_compatible url (…/v1), modelo y api_key de cualquier servidor compatible con OpenAI (LM Studio…).
# url: solo para ollama y openai_compatible. Con anthropic, openai, google y nvidia déjala vacía.
# Coste orientativo: una foto cada intervalo segundos mientras imprime (120 s = 30 fotos por hora). Si la foto
# apenas ha cambiado desde la última revisada no se consulta a la IA (como mucho 2 veces seguidas).
# modelo_confirmar (opcional): otro modelo, mejor, del mismo proveedor que solo se consulta cuando el primero ve un
#                  fallo; si no lo confirma, no cuenta. Así puedes vigilar con uno barato sin pausas en falso.
# Telegram (telegram.cfg): el aviso de pausa trae botones Reanudar / Cancelar / Otra foto, y al bot puedes
# escribirle /foto /estado /reanudar /cancelar.
#
# accion:          pausar (recomendado) | avisar | cancelar
# intervalo:       segundos entre fotos (mínimo 30)
# confirmaciones:  fotos seguidas con fallo antes de actuar (evita falsos positivos)
# umbral:          confianza mínima de la IA (0 a 1) para contar una foto como fallo
# camara:         (opcional) describe tu cámara a la IA, en español o inglés: dónde está y qué piezas de la
#                  impresora salen. P. ej.: cámara en el cabezal muy cerca de la boquilla; la pieza naranja de la
#                  izquierda es el conducto del ventilador; la luz LED deslumbra el centro.
# recorte:        vacío (recomendado): al empezar cada impresión la IA busca la cama en la foto y luego solo mira
#                  esa zona, ampliada; vale para cualquier posición de la cámara (una consulta más por impresión).
#                  Cuando dos respuestas seguidas ven la pieza en el mismo sitio, mira solo la pieza (con margen) y
#                  más grande: los fallos pequeños, como una capa desplazada, se pierden en la foto entera.
#                  "no": la foto entera. O fijo, en % de la imagen: izquierda,arriba,derecha,abajo (p. ej. 0,10,70,100).
#                  --test guarda lo que ve la IA en ia_prueba.jpg (Mainsail > Máquina).
# Cada foto se compara con otra de hace unos minutos de la misma impresión (pieza que se mueve, espagueti que
# crece): cada consulta lleva dos fotos. Si el modelo no admite dos, sigue con una sola.
# espera_inicio:   segundos de impresión antes de empezar a mirar. Los 10 primeros minutos mira cada 60 s
#                  como mínimo (la primera capa es cuando más se despega). Si la IA deja de contestar, avisa.
# Avisos por Telegram con la foto: pon el token de tu bot en telegram.cfg (al lado de este archivo).
# La api_key queda en este archivo: cualquiera con acceso a tu Mainsail puede verla.

[ia]
proveedor:
api_key:
modelo:
modelo_confirmar:
url:
accion: pausar
intervalo: 120
confirmaciones: 2
umbral: 0.7
espera_inicio: 60
camara:
recorte:

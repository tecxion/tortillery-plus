# Tortillery+: avisos por Telegram (inicio, fin y error de impresión, y la foto si la IA ve un fallo).
# 1. En Telegram habla con @BotFather, /newbot, y copia el token que te da.
# 2. Mándale cualquier mensaje a tu bot nuevo.
# 3. Pega el token aquí y guarda. En menos de un minuto te llega "avisos activados".
# chat_id es opcional: vacío, se detecta solo con el mensaje del paso 2.
# (telegram.conf, al lado, es la plantilla de los mensajes: no hace falta tocarlo.)
# El token queda en este archivo: cualquiera con acceso a tu Mainsail puede verlo.



####===CUSTOM MACROS===###

[gcode_macro GANTRY_LIGHT_SWITCH] # Macro para Control Gantry LED FJMB Artillery X4 Pro/Plus
description: Switches Frame's LEDs
gcode: RUN_SHELL_COMMAND CMD=GANTRY_LIGHT_SWITCH

[gcode_macro GANTRY_LIGHT_ON] # Macro para Control Gantry LED FJMB Artillery X4 Pro/Plus
description: Turn On Frame's LEDs
gcode: RUN_SHELL_COMMAND CMD=GANTRY_LIGHT_ON

[gcode_macro GANTRY_LIGHT_OFF] # Macro para Control Gantry LED FJMB Artillery X4 Pro/Plus
description: Turn Off Frame's LEDs
gcode: RUN_SHELL_COMMAND CMD=GANTRY_LIGHT_OFF

[gcode_shell_command GANTRY_LIGHT_SWITCH] # Comandos Shell para INVERTIR el estado de Gantry LED FJMB
command: sh /home/mks/gantryswitch
timeout: 5.
verbose: True

[gcode_shell_command GANTRY_LIGHT_ON] # Comando shell para ENDENCER Gantry LED FJMB
command: sh /home/mks/gantryswitchon
timeout: 5.
verbose: True

[gcode_shell_command GANTRY_LIGHT_OFF] # Comando shell para APAGAR Gantry LED FJMB
command: sh /home/mks/gantryswitchoff
timeout: 5.
verbose:True


#SCREWS_TILT_CALCULATE 
[screws_tilt_adjust]
screw1: 57,17
screw1_name: screw1
screw2: 227,17
screw2_name: screw2
screw3: 227,187
screw3_name: screw3
screw4: 57,187
screw4_name: screw4
horizontal_move_z: 10
speed: 50                                    
screw_thread: CW-M4    

#INPUT_SHAPER_AUTO-CALIBRATE

[gcode_macro SHAPER_CALIBRATE_X]
gcode:
    G28
    SHAPER_CALIBRATE AXIS=X
    SAVE_CONFIG

[gcode_macro SHAPER_CALIBRATE_Y]
gcode:
    G28
    SHAPER_CALIBRATE AXIS=Y
    SAVE_CONFIG
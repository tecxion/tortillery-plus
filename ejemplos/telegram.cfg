# =====================================================================================================================
#  Tortillery+ · ejemplo de config/telegram.cfg / example
# =====================================================================================================================
# DÓNDE: Mainsail > Máquina > telegram.cfg. Se aplica solo en menos de un minuto: te llega "avisos activados".
# (EN)   Mainsail > Machine > telegram.cfg. Applies in under a minute: you get "avisos activados" (enabled).
#
# 1. En Telegram habla con @BotFather, escribe /newbot y copia el token. (EN) Talk to @BotFather, /newbot, copy the token.
# 2. Mándale cualquier mensaje a tu bot nuevo. (EN) Send any message to your new bot.
# 3. Pega el token abajo y guarda. (EN) Paste the token below and save.
#
# Un bot por impresora: dos impresoras con el mismo bot dan "409 Conflict". (EN) One bot per printer.
# ¡OJO! El token queda en este archivo: bórralo antes de compartirlo. (EN) Remove the token before sharing this file.
# No edites telegram.conf (al lado): es la plantilla de los mensajes y se reescribe al actualizar.
# (EN) Don't edit telegram.conf (next to it): it's the message template and is rewritten on update.

[telegram]
token:
chat_id:
# token:   ejemplo / example  123456789:AAH-token-de-BotFather
# chat_id: vacío, se detecta solo con el mensaje del paso 2 / empty, detected from the step 2 message

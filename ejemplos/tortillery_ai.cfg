# =====================================================================================================================
#  Tortillery+ · ejemplo de config/tortillery_ai.cfg (vigilancia con IA) / example (AI monitoring)
# =====================================================================================================================
# DÓNDE: Mainsail > Máquina > tortillery_ai.cfg. Se aplica solo en menos de un minuto, sin reiniciar.
# (EN)   Mainsail > Machine > tortillery_ai.cfg. Applies by itself in under a minute, no restart needed.
# Las actualizaciones no tocan este archivo. (EN) Updates never touch this file.
# Los nombres de las opciones van en español: escríbelos tal cual. (EN) Option names are Spanish: keep them as written.
#
# Prueba por SSH con la cámara mirando a la cama / Test over SSH with the camera on the bed:
#     python3 /usr/local/bin/tortillery-ai.py --test
# y mira ia_prueba.jpg en Mainsail > Máquina. (EN) Then look at ia_prueba.jpg in Mainsail > Machine.
#
# ¡OJO! La api_key queda en este archivo: bórrala antes de compartirlo o de pegar un log.
# (EN) WARNING: the api_key is stored here: remove it before sharing this file or a log.
#
# Elige UNO de los bloques [ia] de abajo, quítale las # y borra los demás.
# (EN) Pick ONE of the [ia] blocks below, remove its # and delete the others.


# --- A) Anthropic: uno barato vigila y uno bueno solo confirma / a cheap one watches, a good one only confirms ------
#[ia]
#proveedor: anthropic
#api_key: PEGA_AQUI_TU_CLAVE            # console.anthropic.com  (EN: paste your key here)
#modelo: claude-haiku-5-5               # mira cada foto / checks every photo
#modelo_confirmar: claude-opus-5-5      # solo cuando el primero ve un fallo / only when the first sees a failure
#accion: pausar                         # pausar (pause) | avisar (notify only) | cancelar (cancel)
#intervalo: 120                         # segundos entre fotos, mínimo 30 / seconds between photos, min 30
#confirmaciones: 2                      # fotos seguidas con fallo antes de actuar / failure photos in a row
#umbral: 0.7                            # confianza mínima 0-1 / minimum confidence 0-1
#espera_inicio: 60                      # segundos antes de empezar a mirar / seconds before watching
#camara:                                # ver F) / see F)
#recorte:                               # vacío = automático (recomendado) / empty = automatic (recommended)


# --- B) Ollama en tu PC: gratis, el PC tiene que estar encendido / free, the PC has to be on ------------------------
#[ia]
#proveedor: ollama
#url: http://192.168.1.50:11434         # la IP de tu PC con Ollama / your PC's IP running Ollama
#modelo: qwen2.5vl                      # descárgalo antes: ollama pull qwen2.5vl / pull it first
#accion: pausar
#intervalo: 120
#confirmaciones: 2
#umbral: 0.7


# --- C) Google Gemini ------------------------------------------------------------------------------------------------
#[ia]
#proveedor: google
#api_key: PEGA_AQUI_TU_CLAVE            # aistudio.google.com
#modelo:                                # vacío = gemini-2.5-flash / empty = gemini-2.5-flash
#accion: pausar


# --- D) OpenAI o NVIDIA: el modelo es obligatorio / the model is required --------------------------------------------
#[ia]
#proveedor: nvidia                      # u / or: openai
#api_key: PEGA_AQUI_TU_CLAVE            # build.nvidia.com  |  platform.openai.com
#modelo: nvidia/nemotron-3.5-super-vl-120b-a12b   # id exacto, con visión / exact id, with vision
#accion: pausar


# --- E) Cualquier servidor compatible con OpenAI (LM Studio...) / any OpenAI-compatible server -----------------------
#[ia]
#proveedor: openai_compatible
#url: http://192.168.1.50:1234/v1
#modelo: nombre-del-modelo
#api_key: lm-studio


# --- F) Opciones para afinar (van dentro del mismo [ia]) / Tuning options (inside the same [ia]) ---------------------
# camara: describe tu cámara a la IA, en español o inglés. (EN) Describe your camera to the AI, Spanish or English.
#   camara: cámara en el cabezal muy cerca de la boquilla; la pieza naranja de la izquierda es el conducto del ventilador
#   camara: camera on the frame, top right; the LED light glares in the centre of the bed
# recorte: vacío = busca la cama o usa tus marcas de http://tortilleryplus.local/ia (recomendado / recommended)
#          no    = la foto entera / the whole photo
#          0,10,70,100 = fijo en % de la imagen: izquierda,arriba,derecha,abajo / fixed in %: left,top,right,bottom
#
# ¿Pausa sin motivo? Sube umbral a 0.8 o confirmaciones a 3, o pon modelo_confirmar.
# (EN) Pauses for no reason? Raise umbral to 0.8 or confirmaciones to 3, or set modelo_confirmar.
# ¿No ve los fallos? Marca la cámara en /ia, rellena camara o baja intervalo.
# (EN) Misses failures? Mark the camera at /ia, fill in camara or lower intervalo.

# =====================================================================================================================
# DÓNDE: Mainsail > Máquina > moonraker.conf. NO lo sustituyas por este archivo: copia solo el fragmento que
#        necesites y cambia lo que ya exista. Las actualizaciones conservan tus cambios (solo añaden lo que falte).
# (EN)   Mainsail > Machine > moonraker.conf. DON'T replace it with this file: copy only the snippet you need and edit
#        what's already there. Updates keep your changes (they only add what's missing).
# Después: reinicia Moonraker. (EN) Then restart Moonraker.
#
# No cambies channel: en [update_manager] ni [update_manager tortillery]: las actualizaciones los reajustan.
# (EN) Don't change channel: in [update_manager] or [update_manager tortillery]: updates reset them.


# --- Entrar desde otra red (VPN, Tailscale...) / Access from another network ------------------------------------------
# Añade tu rango a la lista que ya tenga [authorization]. (EN) Add your range to the existing [authorization] list.
#[authorization]
#trusted_clients:
#    192.168.1.0/24
#    100.64.0.0/10              # Tailscale


# --- Etiquetas de objetos al subir G-code (malla y purga junto a la pieza) / Object labels on upload ----------------
# Ya viene activado. (EN) Already enabled.
#[file_manager]
#enable_object_processing: True


# --- Tiempo de impresión exacto (Klipper Estimator) / Accurate print time ---------------------------------------------
# Ya viene activado; False para desactivarlo. (EN) Already enabled; False to turn it off.
#[analysis]
#enable_auto_analysis: True


# --- Cámaras en Mainsail / Cameras in Mainsail ------------------------------------------------------------------------
# [webcam camara] = la webcam; [webcam ia] = lo último que ha revisado la IA (bórrala si no usas la IA).
# (EN) [webcam camara] = the webcam; [webcam ia] = the last photo the AI checked (delete it if you don't use the AI).
#[webcam camara]
#service: mjpegstreamer-adaptive
#stream_url: /webcam/?action=stream
#snapshot_url: /webcam/?action=snapshot
#flip_horizontal: False         # True si la imagen sale al revés / if the image is mirrored
#flip_vertical: False

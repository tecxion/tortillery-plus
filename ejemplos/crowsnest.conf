# DÓNDE: Mainsail > Máquina > crowsnest.conf. Cambia solo estas líneas dentro de [cam 1]; no toques device:
#        (Tortillery+ elige sola la webcam conectada). Después reinicia crowsnest.
# (EN)   Mainsail > Machine > crowsnest.conf. Change only these lines inside [cam 1]; leave device: alone
#        (Tortillery+ picks the connected webcam by itself). Then restart crowsnest.
# Las actualizaciones conservan el resto del archivo. (EN) Updates keep the rest of the file.

#[cam 1]
#resolution: 1280x720           # una que admita tu cámara / one your camera supports (640x480, 1920x1080...)
#max_fps: 15                    # a la IA le ayuda más la resolución que los fps / resolution helps the AI more than fps

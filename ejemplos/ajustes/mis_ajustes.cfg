# =====================================================================================================================
#  Tortillery+ · ejemplo de config/ajustes/mis_ajustes.cfg
#  (EN) Example for config/ajustes/my_settings.cfg
# =====================================================================================================================
# DÓNDE: Mainsail > Máquina > carpeta "ajustes" (créala si no está) > nuevo archivo, por ejemplo mis_ajustes.cfg.
#        Pega este contenido y quita la # de las líneas que quieras usar (la sección [..] y su opción).
# (EN)   Mainsail > Machine > "ajustes" folder (create it if missing) > new file. Paste this and remove the # from the
#        lines you want (the [..] section and its option).
#
# CÓMO FUNCIONA: printer.cfg lee ajustes/*.cfg al final, así que lo de aquí GANA sobre printer.cfg y las
#        actualizaciones de Tortillery+ no lo tocan. Solo escribe lo que cambias: el resto de la sección sigue igual.
# (EN)   printer.cfg reads ajustes/*.cfg last: this wins over printer.cfg and updates never touch it. Only write what
#        you change; the rest of the section stays the same.
#
# NO PONGAS AQUÍ / DON'T PUT HERE:
#   - Lo que guarda SAVE_CONFIG: pid_kp/ki/kd, z_offset de [probe], [bed_mesh ...], shaper_freq/shaper_type,
#     [endstop_phase ...]. Klipper se negaría a guardar. (EN) What SAVE_CONFIG stores: Klipper would refuse to save.
#   - max_accel, pressure_advance y rotation_distance del extrusor: los guarda la pantalla en tortillery_vars.cfg
#     y ganan sobre este archivo. (EN) The screen saves them in tortillery_vars.cfg and they win over this file.
#
# Después de guardar: "Guardar y reiniciar". Si Klipper da error, vuelve a poner la # (o borra el archivo).
# (EN) After saving: "Save & Restart". If Klipper errors, put the # back (or delete the file).
# Valores de serie: X4 Pro. (EN) Stock values: X4 Pro.


# --- Velocidad máxima / Maximum speed --------------------------------------------------------------------------------
# Más bajo = más silencio y menos fallos en piezas altas. El laminador nunca supera estos límites.
# (EN) Lower = quieter and fewer failures on tall parts. The slicer can never go past these limits.
#[printer]
#max_velocity: 500              # de serie / stock 1000 mm/s
#square_corner_velocity: 5.0    # de serie / stock 5.0


# --- Apagado de calentadores sin actividad / Heaters off when idle ---------------------------------------------------
# Segundos en reposo o en una pausa normal antes de apagar. (Sin filamento nunca apaga solo.)
# (EN) Seconds idle or in a normal pause before turning off. (Out of filament never turns off on its own.)
#[idle_timeout]
#timeout: 3600                  # de serie / stock 1800 (30 min)


# --- Boquilla / Nozzle ------------------------------------------------------------------------------------------------
# Con otra boquilla, repite después el PID y el pressure advance desde la pantalla.
# (EN) With another nozzle, redo PID and pressure advance from the screen afterwards.
#[extruder]
#nozzle_diameter: 0.600         # de serie / stock 0.400
#max_temp: 300                  # de serie / stock 330


# --- Retracción del firmware (G10/G11) / Firmware retraction ----------------------------------------------------------
# Solo si el laminador usa "retracción del firmware". Prueba antes en la consola: SET_RETRACTION RETRACT_LENGTH=0.6
# (EN) Only if the slicer uses "firmware retraction". Try it first in the console: SET_RETRACTION RETRACT_LENGTH=0.6
#[firmware_retraction]
#retract_length: 0.6            # de serie / stock 0.8 mm
#retract_speed: 35              # de serie / stock 40 mm/s


# --- Sensibilidad del homing de X/Y / X/Y homing sensitivity ----------------------------------------------------------
# Golpea el tope o suena a dientes saltando: sube 5. Se para antes de llegar: baja 5. Luego PRUEBA_HOMING.
# (EN) Hits the end or sounds like skipping teeth: raise by 5. Stops early: lower by 5. Then run PRUEBA_HOMING.
#[tmc2209 stepper_x]
#driver_SGTHRS: 50              # de serie / stock 45
#[tmc2209 stepper_y]
#driver_SGTHRS: 75              # de serie / stock 70


# --- Sonda: más precisión / Probe: more accuracy ----------------------------------------------------------------------
# Más toques por punto: la malla tarda más. (EN) More touches per point: the mesh takes longer.
#[probe]
#samples: 3                     # de serie / stock 2
#samples_tolerance: 0.02        # de serie / stock 0.03 mm


# --- Ventilador de capa / Part cooling fan ----------------------------------------------------------------------------
# De serie el 100 % del laminador es el 80 % real. (EN) Stock: the slicer's 100 % is really 80 %.
#[fan]
#max_power: 1.0                 # de serie / stock 0.8


# --- Línea de purga junto a la pieza / Purge line next to the part ----------------------------------------------------
# Solo con etiquetas de objetos en el G-code. Se cambian las variables sin copiar la macro.
# (EN) Only with object labels in the G-code. Change the variables without copying the macro.
#[gcode_macro LINE_PURGE]
#variable_length: 60            # mm de línea / line length (de serie / stock 40)
#variable_amount: 30            # mm de filamento / filament (de serie / stock 25)
#variable_margin: 8             # mm por delante de las piezas / in front of the parts


# --- Aparcado mientras calienta / Parking while heating ---------------------------------------------------------------
#[gcode_macro SMART_PARK]
#variable_z: 10                 # altura / height (mm)
#variable_margin: 10            # distancia a las piezas / distance to the parts (mm)


# --- Recuperación tras corte de luz / Power-loss recovery -------------------------------------------------------------
# Más alto = menos escrituras en la eMMC, pero puede repetir unos segundos más de impresión.
# (EN) Higher = fewer eMMC writes, but it may repeat a few more seconds of printing.
#[plr]
#interval: 10                   # segundos / seconds (de serie / stock 5)


# --- NO TOCAR / DON'T TOUCH -------------------------------------------------------------------------------------------
# Pines, microsteps de X/Y (más de 16 rompe el homing), position_min/max/endstop, rotation_distance de X/Y/Z,
# run_current de los motores y x_offset/y_offset de [probe] (salvo que cambies el cabezal).
# (EN) Pins, X/Y microsteps (above 16 breaks homing), position_min/max/endstop, X/Y/Z rotation_distance, motor
# run_current and [probe] x_offset/y_offset (unless you change the toolhead).

# Avisos por Telegram (Tortillery+). Lo activa telegram_setup.sh, que guarda el bot en
# ~/printer_data/moonraker.secrets y anade [include telegram.conf] a moonraker.conf.
# Pausa (con foto y botones), fin (con foto), video del timelapse y mantenimiento los manda tortillery-ai.service.
[notifier telegram]
url: {secrets.telegram.url}
events: started, error, cancelled
title: Artillery X4
body:
    {% set s = event_args[1] %}
    {% if event_name == "started" %}
    ▶️ Impresión iniciada: {s.filename}
    {% elif event_name == "cancelled" %}
    ⏹ Impresión cancelada: {s.filename}
    {% else %}
    ❌ Error en la impresión: {s.filename}
    {s.message}
    {% endif %}

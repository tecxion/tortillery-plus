# Utilidades Tortillery+ (aparecen en la lista de macros de la pantalla y en Mainsail)

[gcode_shell_command tortillery_backup]
command: /usr/local/bin/tortillery-backup.sh
timeout: 60.
verbose: True

[gcode_shell_command tortillery_maintenance]
command: /usr/local/bin/tortillery-maintenance.sh
timeout: 15.
verbose: True

[gcode_macro COPIA_SEGURIDAD_USB]
description: Guarda la configuracion (printer.cfg con calibracion, macros...) en el USB
gcode:
    RUN_SHELL_COMMAND CMD=tortillery_backup

[gcode_macro MANTENIMIENTO_ESTADO]
description: Horas de impresion desde el ultimo mantenimiento
gcode:
    RUN_SHELL_COMMAND CMD=tortillery_maintenance PARAMS=status

[gcode_macro MANTENIMIENTO_HECHO]
description: Marca el mantenimiento como hecho (husillos engrasados, correas revisadas)
gcode:
    RUN_SHELL_COMMAND CMD=tortillery_maintenance PARAMS=reset

# Luz del cabezal (Neopixel): la elige la pantalla (Utilidades > Luz LED) o a mano. Se guarda en tortillery_vars.cfg
# y se mantiene al imprimir y al reiniciar. MODO: 0 automatico (como antes: sigue la temperatura al calentar y blanco
# despues), 1 color fijo R G B (0-1), 2 sigue al hotend, 3 sigue a la cama.
[gcode_macro LUZ_LED]
description: Luz del cabezal. MODO=0 automatico | 1 color (R= G= B= de 0 a 1) | 2 hotend | 3 cama
gcode:
    {% set modo = params.MODO|default(0)|int %}
    SAVE_VARIABLE VARIABLE=led_modo VALUE={modo}
    {% if modo == 1 %}
        SAVE_VARIABLE VARIABLE=led_r VALUE={[[params.R|default(1)|float, 0]|max, 1]|min}
        SAVE_VARIABLE VARIABLE=led_g VALUE={[[params.G|default(1)|float, 0]|max, 1]|min}
        SAVE_VARIABLE VARIABLE=led_b VALUE={[[params.B|default(1)|float, 0]|max, 1]|min}
    {% endif %}
    _LUZ_LED_APLICAR

[gcode_macro _LUZ_FOTO]
description: Luz del cabezal en blanco a tope para una foto de la IA (después _LUZ_LED_APLICAR la deja como estaba)
gcode:
    SET_LED_TEMPLATE LED=my_neopixel TEMPLATE=""
    SET_LED LED=my_neopixel RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1

[gcode_macro _LUZ_LED_APLICAR]
description: Aplica la luz guardada. FASE=hotend|cama (calentando, la usa el modo automatico) o normal
gcode:
    {% set v = printer.save_variables.variables %}
    {% set modo = v.led_modo|default(0)|int %}
    {% set fase = params.FASE|default('normal')|lower %}
    {% if modo == 1 %}
        SET_LED_TEMPLATE LED=my_neopixel TEMPLATE=""
        SET_LED LED=my_neopixel RED={v.led_r|default(1)} GREEN={v.led_g|default(1)} BLUE={v.led_b|default(1)} SYNC=0 TRANSMIT=1
    {% elif modo == 2 or (modo == 0 and fase == 'hotend') %}
        NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=extruder_temp MODE=glow
    {% elif modo == 3 or (modo == 0 and fase == 'cama') %}
        NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=bed_temp MODE=glow
    {% else %}
        NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=print_percent MODE=progress
    {% endif %}

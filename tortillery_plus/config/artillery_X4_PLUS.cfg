# Printer.cfg X4 PLUS

[include macros.cfg]
[include MCU_ID.cfg]
[include plr.cfg]
[include utilidades.cfg]
[include kamp_tortillery.cfg]
[include calibracion.cfg]
# complementos opcionales que instala extras.sh (timelapse...); si la carpeta está vacía no da error
[include extras/*.cfg]


[mcu rpi]
serial: /tmp/klipper_host_mcu

[idle_timeout]
timeout: 1800   # 30 min sin actividad (antes 10 h con los calentadores encendidos)
gcode:
    {% if printer.print_stats.state == "paused" %}   ; PAUSE de este config usa M25, no BASE_PAUSE: pause_resume.is_paused no cambia
      M104 S0   ; en pausa: solo apaga el hotend; cama y motores siguen para poder reanudar
      UPDATE_DELAYED_GCODE ID=PAUSA_CAMA DURATION=3600   ; y la cama 1 h después si sigue en pausa
      {action_respond_info("Pausa larga: hotend apagado (la cama se apaga en 1 h). RESUME lo vuelve a calentar.")}
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

[virtual_sdcard]
path: /home/mks/printer_data/gcodes

[display_status]

[gcode_arcs]

# Solo actua si el laminador usa G10/G11 ("usar retraccion de firmware")
[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

[exclude_object]

# RESPOND / M118: mensajes a la consola de Mainsail y de la pantalla
[respond]
default_type: echo

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor HOST]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[stepper_x]
step_pin:PC14
dir_pin:!PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2209_stepper_x:virtual_endstop
position_min: -6
position_endstop: -6
position_max: 310
homing_speed:40
homing_retract_dist:0
homing_positive_dir:false
step_pulse_duration:0.000002

[stepper_y]
step_pin:PB7
dir_pin:!PB6
enable_pin:!PB8
microsteps:16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2209_stepper_y:virtual_endstop
position_min: -10
position_endstop:-10 
position_max:310
homing_speed:40
homing_retract_dist:0
homing_positive_dir:false
step_pulse_duration:0.000002

[stepper_z]
step_pin:PC10
dir_pin:!PA15
enable_pin: !PC11
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 405
position_min: -5 
homing_speed:20

[extruder]
step_pin:PB1
dir_pin:!PB2
enable_pin:!PB0
microsteps:16
rotation_distance: 4.706#31.4	#Bondtech 5mm Drive Gears
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0      # detecta termistor desconectado (antes -100)
max_temp: 330
heater_pin: PA7
sensor_type:EPCOS 100K B57560G104F
sensor_pin: PA1
max_power: 1
pressure_advance: 0.03
pressure_advance_smooth_time: 0.02
max_extrude_cross_section:500
instantaneous_corner_velocity: 5.000
max_extrude_only_distance: 500
max_extrude_only_velocity:500
max_extrude_only_accel:8000
step_pulse_duration:0.000002
min_extrude_temp: 160   # evita extruir en frio; 160 para que nozzle_clean (M104 S160) siga funcionando
smooth_time: 2.0

[homing_override]
set_position_z:0
gcode: 
    bed_mesh_clear
    G91
    G1 Z5 F120
    G90
    {% if params.X is defined %}
    {% if params.Y is undefined %}
    {% if params.Z is undefined %}
    G28 X
    {% endif %}
    {% endif %}
    {% endif %}
    {% if params.Y is defined %}
    {% if params.X is undefined %}
    {% if params.Z is undefined %}
    G28 Y
    {% endif %}
    {% endif %}
    {% endif %}
    {% if params.Z is defined %}
    {% if params.X is undefined %}
    {% if params.Y is undefined %}
    G28 Y
    G28 X
    G1 X160 Y165 F3000
    {% set z_max = printer.toolhead.axis_maximum.z-6|int %} 
    SET_KINEMATIC_POSITION Z={z_max}
    probe probe_speed=5 samples=5
    {% set probe_offset=-(printer.configfile.settings['probe'].z_offset) %}
    G91
    G1 Z{probe_offset}  F300
    G90
    SET_KINEMATIC_POSITION Z=0
    G91 
    G1 Z5 F300
    G90
    # G28 Z
    {% endif %}
    {% endif %}
    {% endif %}
    {% if params.X is defined %}
    {% if params.Y is defined %}
    {% if params.Z is undefined %}
    G28 Y
    G28 X
    {% endif %}
    {% endif %}
    {% endif %}
    {% if params.X is undefined %}
    {% if params.Y is undefined %}
    {% if params.Z is undefined %}
    G28 Y
    G28 X
    G1 X160 Y165 F3000
    # G28 Z
    {% set z_max = printer.toolhead.axis_maximum.z-5|int %} 
    SET_KINEMATIC_POSITION Z={z_max}
    probe probe_speed=5 samples=5
    {% set probe_offset=-(printer.configfile.settings['probe'].z_offset) %}
    G91
    G1 Z{probe_offset} F300
    G90
    SET_KINEMATIC_POSITION Z=0 
    G91 
    G1 Z5 F300
    G90
    {% endif %}
    {% endif %}
    {% endif %}
    G90       
    BED_MESH_PROFILE LOAD="default"


[probe]
pin:PA8
x_offset:-17
y_offset: 17
#z_offset: 0.00
speed: 10.0
samples: 2
samples_result: average
sample_retract_dist: 5.0
samples_tolerance: 0.03
samples_tolerance_retries: 3

[axis_twist_compensation]
# La sonda va 17 mm a la izquierda de la boquilla: si el eje X no es perfectamente recto, mide distinto en cada lado.
# Se calibra desde la pantalla (Nivelación > Calibración > Torsión del eje X) con un papel en 3 puntos.
calibrate_start_x: 40
calibrate_end_x: 300
calibrate_y: 140

[bed_mesh]
speed:120                
horizontal_move_z:10     
mesh_min:20,20           
mesh_max:290,290
probe_count:6,6         
algorithm:bicubic 
bicubic_tension:0.2
mesh_pps: 4, 4   
adaptive_margin: 5   # margen alrededor de las piezas para BED_MESH_CALIBRATE ADAPTIVE=1

[verify_heater extruder]
max_error: 120
check_gain_time:5
hysteresis: 5
heating_gain: 1

[heater_bed]
heater_pin:PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
max_power: 1.0
min_temp: 0      # detecta termistor desconectado (antes -100)
max_temp: 200


[verify_heater heater_bed]
max_error: 120
check_gain_time: 120   # antes 300 s / 1 C: ahora 2 C en 120 s (valores de Tortillery 2.0)
hysteresis: 3
heating_gain: 2

#fan for printed model FAN1
[fan]
pin:PA4
max_power: 0.8
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

#fan for printed model FAN0
[heater_fan fan0]
pin: PC7
shutdown_speed: 1
heater_temp: 45.0

#fan for printed model FAN2
[heater_fan fan2]
pin: PC9
shutdown_speed: 1 

[printer]
kinematics:cartesian
max_velocity: 1000
max_accel: 10000
minimum_cruise_ratio: 0.5
max_z_velocity: 30
max_z_accel: 200
square_corner_velocity: 5.0

[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 99.6

#shaper_type_y: 2hump_ei
#shaper_freq_y: 41.0

####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[gcode_macro G29]
gcode:
      BED_MESH_CLEAR
      G28
      BED_MESH_CALIBRATE
      G0 Z50 F1800
      G0 X170 Y175 F12000



[filament_switch_sensor fila]
pause_on_runout: True
runout_gcode:
            SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
event_delay: 5.0
pause_delay: 5.0
switch_pin: PA6

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_x]
uart_pin: PB9
run_current: 1.1
hold_current: 0.8
interpolate: True
stealthchop_threshold:0
driver_SGTHRS:70
diag_pin:^PC0

[tmc2209 stepper_y]
uart_pin: PB5
run_current: 1.2
hold_current: 0.8
interpolate: True
stealthchop_threshold:0
driver_SGTHRS:90
diag_pin:^PC1

[tmc2209 stepper_z]
uart_pin: PC4
run_current: 1.1
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PC5
run_current: 0.8
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0


[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0
axes_map:-x, -y, -z

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20  # an example
min_freq: 10
max_freq: 70
accel_per_hz:140

[force_move]
enable_force_move : true


[gcode_macro nozzle_wipe]
gcode:
      G1 X230 Y300 Z10 F5000
      SET_KINEMATIC_POSITION Y=0

      G1 Y20  F6000
      G1 X230 F8000
      G1 Z-1  F600 
      G1 X270 F8000
      G1 Y25  F8000
      G1 X230 F8000

      G92 E0
      G1 Z10 F1200
      G1 Y0 F5000
      G1 E-1 F3000
      M400
      SET_KINEMATIC_POSITION Y=300
      G92 E-1

[gcode_macro nozzle_clean]
gcode:
      G28
      M109 S190
      M104 S160
      nozzle_wipe

[gcode_macro draw_line_only]
gcode:
      G1 X180 Y310 Z0.8 F18000.0
      SET_KINEMATIC_POSITION Y=0
      G92 E0
      G1 Z1.0 F600 ; move z up little to prevent scratching of surface
      G1 X180 Y2 Z0.4 F18000.0 ; move to start-line position
      G1 E8 F300
      G92 E0
      G1 X70  Y2 Z0.4 F1800.0 E11.0;draw line

      G92 E0
      G1 X70  Y0 Z0.4 F1800.0 E0.2;draw line

      G92 E0
      G1 X170 Y0 Z0.4 F1800.0 E10.0;draw line

      G92 E0
      G1 X170 Y4 Z0.4 F1800.0 E0.4;draw line

      G92 E0
      G1 X80  Y4 Z0.4 F1800.0 E9;draw line
  
      G92 E0
      G1 X80  Y0 Z0.4 F1800.0 E0.4;draw line
  
      G92 E0 ; reset extruder
      G1 E-1 Z5 F18000 ; move z up little to prevent scratching of surface
      G92 E0

      G1 Y0 F18000.0
      SET_KINEMATIC_POSITION Y=310

[gcode_macro draw_line]
gcode:      
      nozzle_wipe
      draw_line_only


[gcode_macro PRINT_START]
description: Inicio de impresion. Con BED= y EXTRUDER= calienta, hace home, malla adaptativa y purga
gcode:
    # Laminador (Orca): PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
    # Laminador (Cura): PRINT_START BED={material_bed_temperature_layer_0} EXTRUDER={material_print_temperature_layer_0}
    # Sin parametros se comporta como antes (el G-code del laminador hace el resto). PURGE=0 omite draw_line.
    {% set bed = params.BED|default(0)|float %}
    {% set hotend = params.EXTRUDER|default(0)|float %}
    M220 S100
    M221 S100
    CLEAR_PAUSE
    M117 Printing
    {% if bed > 0 and hotend > 0 %}
      M140 S{bed}
      M104 S{[150, hotend]|min}   ; precalienta sin gotear mientras palpa
      G28
      M190 S{bed}
      BED_MESH_CALIBRATE ADAPTIVE=1   ; malla solo bajo las piezas (necesita etiquetas de objetos)
      G90
      SMART_PARK      ; calentar junto a las piezas (sin etiquetas: fuera de la cama, como GOTEO_FUERA de Tortillery 2.0)
      M109 S{hotend}
      {% if params.PURGE|default(1)|int %}
      LINE_PURGE      ; purga delante de las piezas (sin etiquetas: draw_line de siempre)
      {% endif %}
    {% endif %}
                             
[gcode_macro PRINT_END]
gcode:
    M220 S100
    M221 S100

[pause_resume]


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    PRINT_END
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    BASE_CANCEL_PRINT     ; para la lectura del archivo y marca el trabajo como cancelado (historial)
    SDCARD_RESET_FILE     ; vuelve a 'standby' como antes (la pantalla vuelve al menu)
    TURN_OFF_HEATERS      ; primero los calentadores: si algo falla despues, quedan apagados
    M107
    {% if printer.extruder.can_extrude %}
    M83
    G1 E-10 F1200         ; retrae solo con la boquilla caliente (en frio daria error)
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{[10, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min} F600
    G90
    G1 X0 F6000           ; aparca X sin G28 (homing_override ponia Z=0 y perdia la referencia)
    {% endif %}
    M84


# Antes output_pin: en esta version de Klipper solo pwm_cycle_time acepta CYCLE_TIME (tono de M300)
[pwm_cycle_time BEEPER_pin]
pin: PA2
value: 0
#   Silent at power on, set to 1 if active low.
shutdown_value: 0
#   Disable at emergency shutdown (no PWM would be available anyway).
cycle_time: 0.001
#   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz
#   Although not pitch perfect.

## 定义 M300 宏，实现 Gcode 功能
[gcode_macro M300]
description: Pitido. M300 S<Hz> P<ms> B<repeticiones>
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% set t = params.B|default(1)|int %}
    {% for i in range(t) %}
        SET_PIN PIN=BEEPER_pin VALUE={0.5 if S > 0 else 0} CYCLE_TIME={1.0 / S if S > 0 else 1}
        G4 P{P}
        SET_PIN PIN=BEEPER_pin VALUE=0
        G4 P{P}
    {% endfor %}

[gcode_macro M600]
description: Cambio de filamento: pausa, aparca y avisa en la pantalla
gcode:
    RESPOND TYPE=command MSG="Tortillery: cambio de filamento (M600)"   ; KlipperLCD muestra que hacer
    {% set X = params.X|default(50)|float %}
	{% set Y = params.Y|default(0)|float %}
	{% set Z = params.Z|default(20)|float %}
	{% set t = params.B|default(3)|int %}
	
    {% if params.X is undefined %} 
    {% if params.Y is undefined %}
    M300 B{t}
    PAUSE Z={Z}
    {% endif %}
    {% endif %}

    {% if params.X is defined %} 
    {% if params.Y is undefined %}
	M300 B{t}
    PAUSE X={X} Z={Z}
    {% endif %}
    {% endif %}

    {% if params.X is undefined %} 
    {% if params.Y is defined %}
	M300 B{t}
    PAUSE Y={Y} Z={Z}
    {% endif %}
    {% endif %}

    {% if params.X is defined %} 
    {% if params.Y is defined %} 
	M300 B{t}
    PAUSE X={X} Y={Y} Z={Z}
    {% endif %}
    {% endif %}
                                                     


[gcode_macro T600]
variable_zhop: 0
variable_etemp: 0
gcode:    
    RESUME


[delayed_gcode PAUSA_CAMA]
gcode:
    {% if printer.print_stats.state == "paused" %}
      M140 S0
      {action_respond_info("Pausa de mas de 1,5 h: cama apagada. RESUME la vuelve a calentar (la pieza puede despegarse).")}
    {% endif %}


[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode: 
    {% set X = params.X|default(50)|float %}
	{% set Y = params.Y|default(0)|float %}

    {% set z = params.Z|default(20)|int %}                                                   
    {% set e = params.E|default(2.5) %} 
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                             
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=btemp VALUE={printer.heater_bed.target}                                              
    SAVE_GCODE_STATE NAME=PAUSE                                                                  
    M25                                                                              
    {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       
      G91
	    M83
	    G1 E-{e} F2100
      G1 Z{z} F900                                                                     
    {% else %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    {% endif %}
    SAVE_GCODE_STATE NAME=PAUSEPARK
    G90        
    {% if params.X is defined %}  
        G1 X{X} F3000   
    {% endif %}    
    {% if params.Y is defined %}  
        G1 Y{Y} F3000   
    {% endif %}                                                                    
    #G1 X0 Y0 F6000
	 # G1 E{e} F2100	
    # (quitado SET_IDLE_TIMEOUT 43200: ahora idle_timeout apaga el hotend en pausas largas)                                                       


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_btemp: 0
gcode:
    #G28 X Y
    {% set e = params.E|default(2.5)|int %}                                          
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    UPDATE_DELAYED_GCODE ID=PAUSA_CAMA DURATION=0
    {% if btemp > 0 and printer.heater_bed.target == 0 %}
    M190 S{btemp}   ; la cama se apagó en una pausa muy larga
    {% endif %}
    {% if etemp > 0 %}
    M109 S{etemp}   ; recalienta si idle_timeout apago el hotend en la pausa
    {% endif %}
    G91                                                                               
    M83
	#   G1 E-{e} F900		
    RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     
    {% if etemp > 0 or printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}                                                
      G1 Z{zhop * -1} F900
	    G1 E{e+0.5} F900	  
    {% else %}                      
      G1 Z{zhop * -1} F900                                                     
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60 
    M24



#[output_pin LAMP]
#pin:PA8
#shutdown_value: 0.0

[neopixel my_neopixel]
pin:PA3
chain_count:1
color_order:GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[gcode_macro NEOPIXEL_DISPLAY]
gcode:
    {% set led = params.LED %}
    {% set type = params.TYPE %}
    {% set mode = params.MODE %}
    {% set my_neopixel = printer.configfile.config['neopixel ' ~ led] %}

    {% if mode == 'progress' %}
        {% for i in range(my_neopixel.chain_count|int) %}
            SET_LED_TEMPLATE LED={led} INDEX={i+1} TEMPLATE={'led_' ~ type ~ '_' ~ mode} param_led_num={i+1} param_led_total={my_neopixel.chain_count|int}
        {% endfor %}
    {% endif %}
    {% if mode == 'glow' %}
        SET_LED_TEMPLATE LED={led} TEMPLATE={'led_' ~ type ~ '_' ~ mode}
    {% endif %}


[display_template led_extruder_temp_glow]
text:
    {% if printer.extruder.target > 0.0 %}
        {%  set temp = printer.extruder.target %}
    {% else %}
        {% set temp = printer.configfile.config.extruder.max_temp %}
    {% endif %}
    {% set ratio = printer.extruder.temperature / temp|float %}
    {0.5}, 0.0, {1-ratio}, 0.0

[display_template led_bed_temp_glow]
text:
    {% if printer.heater_bed.target > 0.0 %}
        {%  set temp = printer.heater_bed.target %}
    {% else %}
        {% set temp = printer.configfile.config.heater_bed.max_temp %}
    {% endif %}
    {% set ratio = printer.heater_bed.temperature / temp|float %}
    {0.1}, 0.0, {0.5-ratio}, 0.0


[display_template led_print_percent_progress]
param_led_num:  0
param_led_total: 1
text:
    
        1, 1, 1, 0.0
   

[gcode_macro M109]
rename_existing: M99109
gcode:
     #SAVE_VARIABLE VARIABLE=htemp VALUE='{printer.extruder.temperature}'
     NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=extruder_temp MODE=glow
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}   ; Wait for hotend temp (within 1 degree)
         #NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=extruder_temp MODE=glow
    {% endif %}
    NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=print_percent MODE=progress 
    
    
[gcode_macro M190]
rename_existing: M99190
gcode:
     NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=bed_temp MODE=glow
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+2}  ; Wait for bed temp (within 1 degree)
    {% endif %}




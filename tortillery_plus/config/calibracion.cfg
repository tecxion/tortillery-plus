# Tortillery+ 2.0: calibraciones que SAVE_CONFIG no guarda. Las escribe la pantalla (Nivelación > Calibración)
# con SAVE_VARIABLE en tortillery_vars.cfg y se aplican solas al arrancar Klipper:
#   max_accel          la que recomienda el input shaper (y M204 del laminador no la supera)
#   pressure_advance   el elegido en el patrón de líneas (el último; vale para cualquier material)
#   pa_pla, pa_petg, pa_abs, pa_tpu   el de cada material: PRINT_START MATERIAL=... aplica el suyo
#   rotation_distance  del extrusor, corregida midiendo 100 mm
# Para volver a los valores de printer.cfg: borra la línea de tortillery_vars.cfg y reinicia el firmware.

[save_variables]
filename: ~/printer_data/config/tortillery_vars.cfg

[delayed_gcode TORTILLERY_CALIBRACION]
initial_duration: 1
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.max_accel is defined %}
        SET_VELOCITY_LIMIT ACCEL={v.max_accel}
    {% endif %}
    {% if v.pressure_advance is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={v.pressure_advance}
    {% endif %}
    {% if v.rotation_distance is defined %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={v.rotation_distance}
    {% endif %}
    _LUZ_LED_APLICAR   ; luz del cabezal elegida en la pantalla (LUZ_LED, utilidades.cfg)
    {% if 'default' in printer.bed_mesh.profiles and not printer.bed_mesh.profile_name %}
        BED_MESH_PROFILE LOAD=default   ; tras SAVE_CONFIG Klipper arranca sin malla: Mainsail no la mostraba
    {% endif %}

[gcode_macro M204]
description: Aceleración del laminador, sin pasar de la que recomendó el input shaper
rename_existing: M204.1
gcode:
    {% set lim = printer.save_variables.variables.max_accel|default(0)|float %}
    {% if 'S' in params %}
        {% set a = params.S|float %}
    {% elif 'P' in params and 'T' in params %}
        {% set a = [params.P|float, params.T|float]|min %}
    {% else %}
        {% set a = params.P|default(params.T|default(0))|float %}
    {% endif %}
    {% if a > 0 %}
        M204.1 S{[a, lim]|min if lim > 0 else a}
    {% endif %}

# ---- Repetibilidad del homing de X/Y (sin finales de carrera: lo detecta el driver TMC al bloquearse el motor)
# PRUEBA_HOMING mide cuánto cambia el punto de homing (en mm, con la posición del motor en el momento de detectar)
# y FIJAR_HOMING, si la variación es pequeña, guarda la fase del motor para que cada homing acabe en el mismo micropaso
# (lo que hace falta para que la recuperación tras un corte de luz vuelva al punto exacto).
[endstop_phase]

[gcode_macro _PH]
variable_x: []
variable_y: []
variable_mm: -1.0
variable_homings: 0   # homings desde que arrancó Klipper (lo cuenta homing_override)
variable_limpia: 0    # 1 si PRUEBA_HOMING empezó sin homings previos (la fase de Klipper usa todos)
gcode:

[gcode_macro _PH_GUARDAR]
gcode:
    {% set lh = printer.endstop_phase.last_home %}
    {% set v = printer['gcode_macro _PH'] %}
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=x VALUE={(v.x + [lh.stepper_x.mcu_position])|string|replace(' ', '')}
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=y VALUE={(v.y + [lh.stepper_y.mcu_position])|string|replace(' ', '')}

[gcode_macro _PH_INFORME]
gcode:
    {% set v = printer['gcode_macro _PH'] %}
    {% set out = [] %}
    {% set worst = [] %}
    {% for ax in ['x', 'y'] %}
        {% set s = printer.configfile.settings['stepper_' ~ ax] %}
        {% set paso = s.rotation_distance / (s.full_steps_per_rotation * s.microsteps) %}
        {% set pos = v[ax] %}
        {% set mm = (pos|max - pos|min) * paso %}
        {% set _ = worst.append(mm) %}
        {% set _ = out.append('%s: varía %.2f mm en %d homings' % (ax|upper, mm, pos|length)) %}
    {% endfor %}
    {% set w = worst|max %}
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=mm VALUE={w}
    {% if w <= 0.05 %}
        {% set _ = out.append('Muy bien: el homing ya es repetible.') %}
    {% elif w <= 0.3 %}
        {% if v.limpia %}
            {% set _ = out.append('Se puede dejar exacto: ejecuta FIJAR_HOMING (guarda y reinicia Klipper).') %}
        {% else %}
            {% set _ = out.append('Bien. Para fijarlo: reinicia Klipper (FIRMWARE_RESTART), lanza PRUEBA_HOMING sin hacer antes ningún homing y luego FIJAR_HOMING.') %}
        {% endif %}
    {% elif w > 2 %}
        {% set _ = out.append('Algún homing se paró antes del tope o el motor patinó contra él: ajusta la sensibilidad (SGTHRS) del eje que varía.') %}
    {% else %}
        {% set _ = out.append('Demasiada variación para fijarlo: revisa la tensión de las correas y repite la prueba.') %}
    {% endif %}
    RESPOND MSG="Homing - {out|join(' | ')}"

[gcode_macro PRUEBA_HOMING]
description: Mide cuánto varía el homing de X/Y (VECES=8). Sin imprimir; deja Z a la misma altura pero sin referencia.
gcode:
    {% set n = params.VECES|default(8)|int %}
    {% if printer.print_stats.state in ('printing', 'paused') %}
        {action_raise_error("PRUEBA_HOMING: no se puede con una impresión en marcha")}
    {% endif %}
    {% set xmax = printer.configfile.settings.stepper_x.position_max - 60 %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max - 60 %}
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=x VALUE=[]
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=y VALUE=[]
    SET_GCODE_VARIABLE MACRO=_PH VARIABLE=limpia VALUE={1 if printer['gcode_macro _PH'].homings == 0 else 0}
    RESPOND MSG="Probando el homing de X/Y {n + 1} veces..."
    G28 X Y
    G91
    G1 Z-5 F600   ; el homing de X/Y sube Z 5 mm: se vuelve a bajar para no ir subiendo en cada vuelta
    G90
    _PH_GUARDAR
    {% for i in range(n) %}
        G1 X{40 + (i * 67) % (xmax - 40)} Y{40 + (i * 89) % (ymax - 40)} F6000
        G28 X Y
        G91
        G1 Z-5 F600
        G90
        _PH_GUARDAR
    {% endfor %}
    _PH_INFORME

[gcode_macro FIJAR_HOMING]
description: Tras PRUEBA_HOMING: guarda la fase de los motores X/Y para que el homing caiga siempre en el mismo punto
gcode:
    {% set mm = printer['gcode_macro _PH'].mm|float %}
    {% if mm < 0 %}
        {action_raise_error("FIJAR_HOMING: ejecuta antes PRUEBA_HOMING")}
    {% elif mm > 0.3 %}
        {action_raise_error("FIJAR_HOMING: el homing varía %.2f mm (máximo 0.30): no se puede fijar sin riesgo" % mm)}
    {% elif not printer['gcode_macro _PH'].limpia %}
        {action_raise_error("FIJAR_HOMING: hubo homings antes de PRUEBA_HOMING y la fase saldría mal. Reinicia Klipper (FIRMWARE_RESTART), lanza PRUEBA_HOMING sin hacer antes ningún homing y luego FIJAR_HOMING")}
    {% endif %}
    ENDSTOP_PHASE_CALIBRATE STEPPER=stepper_x
    ENDSTOP_PHASE_CALIBRATE STEPPER=stepper_y
    RESPOND MSG="Homing fijado. Guardando y reiniciando Klipper..."
    SAVE_CONFIG

# ---- Pressure advance por material (como la calibración de flujo por filamento de Bambu o Creality, pero con el
# patrón de líneas). La pantalla guarda pa_<material> al elegir la línea; PRINT_START MATERIAL=PETG aplica el suyo.
# Laminador (Orca): PRINT_START ... MATERIAL=[filament_type]   (Cura: MATERIAL={material_type})
[gcode_macro _APARCAR]
description: Al acabar un patrón: sube 10 mm, aparta el cabezal a la izquierda y saca la cama adelante del todo
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z{[10, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min} F600
        G90
        G1 X0 Y{printer.toolhead.axis_maximum.y - 10} F6000   ; como el PRINT_END de Artillery (Y240 de 250)
    {% endif %}

[gcode_macro _PA_MATERIAL]
description: Aplica el pressure advance guardado para MATERIAL (si no hay, el general)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set m = params.MATERIAL|default('')|upper %}
    {% set clave = 'pa_pla' if m.startswith('PLA') else 'pa_petg' if m.startswith('PET')
        else 'pa_abs' if m.startswith('ABS') or m.startswith('ASA')
        else 'pa_tpu' if m.startswith('TPU') or m.startswith('TPE') or 'FLEX' in m else '' %}
    {% if clave and v[clave] is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={v[clave]}
        RESPOND MSG="Pressure advance de {m}: {v[clave]}"
    {% elif v.pressure_advance is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={v.pressure_advance}
    {% else %}
        SET_PRESSURE_ADVANCE ADVANCE={printer.configfile.settings.extruder.pressure_advance}
    {% endif %}

[gcode_macro GUARDAR_PA]
description: Guarda a mano el pressure advance de un material. GUARDAR_PA MATERIAL=PETG VALOR=0.045
gcode:
    {% set m = params.MATERIAL|default('')|lower %}
    {% set pa = params.VALOR|default(-1)|float %}
    {% if m not in ('pla', 'petg', 'abs', 'tpu') %}
        {action_raise_error("GUARDAR_PA: MATERIAL tiene que ser PLA, PETG, ABS o TPU")}
    {% elif pa < 0 or pa > 1 %}
        {action_raise_error("GUARDAR_PA: VALOR entre 0 y 1 (p. ej. 0.04)")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=pa_{m} VALUE={pa}
    RESPOND MSG="Pressure advance de {m|upper} guardado: {pa}"

# ---- Escuadra de X/Y (skew_correction): corrige que X e Y no formen exactamente 90 grados (piezas romboides,
# agujeros que no encajan). Imprime Tortillery/escuadra_PLA.gcode, mide con un calibre las dos diagonales y el lado
# delantero (la esquina A es la de la marca, delante a la izquierda) y lanza CALIBRAR_ESCUADRA AC= BD= AD=.
[skew_correction]

[gcode_macro CALIBRAR_ESCUADRA]
description: Tras imprimir la escuadra: CALIBRAR_ESCUADRA AC=141.2 BD=141.6 AD=100.1 (en mm). Guarda y reinicia
gcode:
    {% set ac = params.AC|default(0)|float %}
    {% set bd = params.BD|default(0)|float %}
    {% set ad = params.AD|default(0)|float %}
    {% if not (130 < ac < 155 and 130 < bd < 155 and 90 < ad < 110) %}
        {action_raise_error("CALIBRAR_ESCUADRA: medidas fuera de rango (diagonales AC y BD ~141 mm, lado AD ~100 mm)")}
    {% elif (ac - bd)|abs > 4 %}
        {action_raise_error("CALIBRAR_ESCUADRA: las diagonales se diferencian %.1f mm: revisa la mecánica antes" % (ac - bd)|abs)}
    {% elif printer.print_stats.state in ('printing', 'paused') %}
        {action_raise_error("CALIBRAR_ESCUADRA: no se puede con una impresión en marcha")}
    {% endif %}
    SET_SKEW XY={ac},{bd},{ad}
    SKEW_PROFILE SAVE=tortillery
    SET_SKEW CLEAR=1
    RESPOND MSG="Escuadra guardada (se aplica en cada impresión). Guardando y reiniciando Klipper..."
    SAVE_CONFIG

[gcode_macro QUITAR_ESCUADRA]
description: Borra la corrección de escuadra guardada. Guarda y reinicia
gcode:
    SET_SKEW CLEAR=1
    SKEW_PROFILE REMOVE=tortillery
    SAVE_CONFIG

[gcode_macro _ESCUADRA_ON]
description: Aplica la escuadra guardada (PRINT_START, tras la purga; y al reanudar tras un corte de luz)
gcode:
    {% if 'skew_correction tortillery' in printer.configfile.settings %}
        SKEW_PROFILE LOAD=tortillery
    {% endif %}

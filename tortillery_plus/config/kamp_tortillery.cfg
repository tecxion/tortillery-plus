# Tortillery+: aparcado y purga adaptativos (la idea de KAMP; la malla adaptativa ya la hace Klipper con
# BED_MESH_CALIBRATE ADAPTIVE=1). Usan las etiquetas de objetos del G-code (Moonraker enable_object_processing u
# OrcaSlicer "Label objects"); sin etiquetas, PRINT_START hace lo de siempre.

[gcode_macro SMART_PARK]
description: Aparca la boquilla junto a las piezas mientras calienta (la gota cae fuera de ellas)
variable_z: 10          # altura de aparcado
variable_margin: 10     # distancia a la esquina delantera izquierda de las piezas
gcode:
    {% set pts = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set lo = printer.toolhead.axis_minimum %}
    {% set hi = printer.toolhead.axis_maximum %}
    {% if pts %}
        {% set x = [[(pts | map(attribute=0) | min) - margin, lo.x + 1] | max, hi.x - 1] | min %}
        {% set y = [[(pts | map(attribute=1) | min) - margin, lo.y + 1] | max, hi.y - 1] | min %}
        SAVE_GCODE_STATE NAME=smart_park
        G90
        G1 Z{[z, hi.z]|min} F1200
        G1 X{x} Y{y} F6000
        RESTORE_GCODE_STATE NAME=smart_park
    {% else %}
        G90
        G1 X{hi.x - 5} Z{z} F5000   ; sin etiquetas: fuera de la cama, como antes
    {% endif %}

[gcode_macro LINE_PURGE]
description: Línea de purga delante de las piezas (no en el borde de la cama)
variable_length: 40         # mm de línea
variable_amount: 25         # mm de filamento
variable_height: 0.8        # mm
variable_margin: 8          # distancia por delante de las piezas
variable_flow: 12           # mm3/s
gcode:
    {% set pts = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set lo = printer.toolhead.axis_minimum %}
    {% set hi = printer.toolhead.axis_maximum %}
    {% if not pts %}
        draw_line   ; sin etiquetas: la purga de siempre
    {% else %}
        {% set x0 = [[pts | map(attribute=0) | min, [lo.x, 0] | max + 2] | max, hi.x - length - 2] | min %}
        {% set y = [(pts | map(attribute=1) | min) - margin, [lo.y, 0] | max + 2] | max %}   ; nunca fuera de la cama
        {% set dia = printer.configfile.settings.extruder.filament_diameter %}
        {% set area = 3.14159 * (dia / 2) ** 2 %}
        {% set speed = (flow / area) * (length / amount) * 60 %}   ; mm/min para dar ese caudal
        SAVE_GCODE_STATE NAME=line_purge
        G90
        M83
        G1 Z{height + 5} F1200
        G1 X{x0} Y{y} F6000
        G1 Z{height} F1200
        G1 X{x0 + length} E{amount} F{speed}
        G1 E-0.5 F2100
        G1 Z{height + 2} F1200
        RESTORE_GCODE_STATE NAME=line_purge
    {% endif %}
